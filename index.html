<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiktor Kuranowski - Data & BI Analyst</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* ================= RESET ================= */

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Inter', sans-serif;
    background-color: #f1f5f9;
    color: #334155;
    line-height: 1.65;
    padding: 2rem 1rem 4rem 1rem;
    -webkit-font-smoothing: antialiased;
}

/* ================= WRAPPER ================= */

.wrapper { max-width: 1080px; margin: 0 auto; }

.action-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 1.5rem;
}

.btn-download {
    display: inline-flex;
    align-items: center;
    background-color: #0284c7;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 0.6rem 1.4rem;
    border-radius: 8px;
    transition: 0.3s;
    box-shadow: 0 4px 10px rgba(2,132,199,0.2);
    font-size: 0.9rem;
}

.btn-download:hover {
    background-color: #0369a1;
    transform: translateY(-2px);
}

.btn-download svg {
    width: 18px;
    height: 18px;
    margin-right: 8px;
}

/* ================= CV CONTAINER ================= */

.cv-container {
    background: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #e2e8f0;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
}

/* ================= SIDEBAR ================= */

.sidebar {
    width: 100%;
    background-color: #f8fafc;
    padding: 2rem 1.5rem;
    border-bottom: 1px solid #e2e8f0;
}

.profile-photo-container { text-align: center; margin-bottom: 1.8rem; }

.profile-photo {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #fff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.08);
}

.sidebar h2 {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 2rem 0 1rem 0;
    color: #64748b;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 0.4rem;
}

.info-list, .skills-list { list-style: none; }

.info-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 0.8rem;
    font-size: 0.9rem;
}

.info-list a { color: #0284c7; text-decoration: none; }

.icon {
    width: 18px;
    height: 18px;
    color: #0284c7;
    flex-shrink: 0;
}

.skills-list li { margin-bottom: 0.6rem; font-size: 0.9rem; }

.course-item { font-size: 0.85rem; margin-bottom: 1rem; }

/* ================= MAIN ================= */

.main-content { padding: 2.5rem 1.5rem; }

.name {
    font-size: 2.2rem;
    font-weight: 800;
    color: #0f172a;
    line-height: 1.1;
}

.job-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: #0284c7;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 0.5rem;
}

.section-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin: 2.5rem 0 1.5rem 0;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #0f172a;
}

.section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background-color: #e2e8f0;
    margin-left: 1rem;
}

.profile-text { font-size: 0.95rem; text-align: justify; }

/* ================= TIMELINE ================= */

.timeline {
    border-left: 2px solid #e2e8f0;
    padding-left: 1.5rem;
}

.timeline-item {
    position: relative;
    margin-bottom: 2.5rem;
}

.timeline-item::before {
    content: '';
    position: absolute;
    left: -1.5rem;
    top: 4px;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: #fff;
    border: 3px solid #0284c7;
}

.item-company { font-weight: 700; }
.item-date {
    font-size: 0.75rem;
    background: #f1f5f9;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
    margin-top: 4px;
}

.item-title {
    font-weight: 600;
    color: #0284c7;
    margin: 6px 0;
}

.item-desc { font-size: 0.9rem; }

/* ================= DESKTOP ================= */

@media (min-width: 1024px) {

    body { padding: 3rem 1rem 5rem 1rem; }

    .cv-container { flex-direction: row; }

    .sidebar {
        width: 32%;
        border-bottom: none;
        border-right: 1px solid #e2e8f0;
        padding: 3.5rem 2.5rem;
    }

    .main-content { width: 68%; padding: 4rem; }

    .profile-photo { width: 160px; height: 160px; }

    .name { font-size: 3rem; }

    .section-title { font-size: 1.4rem; }
}

/* ================= PRINT ================= */

@media print {
    .action-bar { display: none; }
    body { background: #fff; padding: 0; }
    .cv-container { box-shadow: none; border: none; }
}

</style>
</head>
